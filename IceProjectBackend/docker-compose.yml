version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: sales-system-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: sales_system
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - sales-system-network

  redis:
    image: redis:alpine
    container_name: sales-system-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sales-system-network

  app:
    build: .
    container_name: sales-system-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/sales_system?authSource=admin
      REDIS_URL: redis://redis:6379
    volumes:
      - ./uploads:/app/uploads
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - sales-system-network
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:

networks:
  sales-system-network:
    driver: bridge
